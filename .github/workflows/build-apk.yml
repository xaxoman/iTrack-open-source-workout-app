name: Build Android APK

# Mirrors build-apk.bat on CI: Vite build -> Capacitor sync -> Gradle assembleDebug.
# Runs on every push to main and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/package-lock.json

      # The Capacitor 7 Android plugins require the Java 21 toolchain.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      # Copies dist/ into android/app/src/main/assets/public and refreshes plugins.
      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itrack-debug-apk-${{ github.run_number }}
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
